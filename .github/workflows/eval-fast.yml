name: eval-fast (Tier 1a)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "001-access-impact-copilot"]

concurrency:
  group: eval-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier-1a:
    name: Validate, Typecheck, Test & Tier-1a Eval
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: copilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d copilot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/copilot_ci' }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EMBEDDING_PROVIDER: voyage
      MODEL_PROVIDER: anthropic
      APPROVAL_ENGINE: in-memory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate seed dataset and golden suite
        run: python scripts/validate_seed.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Database migrate & seed (Neon / Postgres + pgvector)
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Integration tests
        run: pnpm test:integration

      - name: Tier-1a fast evaluation gate (SC-010 & SC-006)
        run: pnpm eval:fast
