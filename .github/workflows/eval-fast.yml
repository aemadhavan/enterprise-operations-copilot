# DB-backed integration tests and the Tier-1a eval run locally only until v0.2
# (Neon serverless driver needs a WebSocket proxy; no API keys in CI).
name: ci (validate, typecheck, unit tests)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "001-access-impact-copilot"]

concurrency:
  group: eval-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier-1a:
    name: ci (validate, typecheck, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate seed dataset and golden suite
        run: python scripts/validate_seed.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit
